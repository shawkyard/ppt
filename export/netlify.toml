# Static site — no build step. Optional config.
[build]
  publish = "."
  command = ""

# The site makes no external requests; these headers keep it locked down.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Stonebrook Deal Scout — 30s promo</title>
<style>
  html,body{margin:0;background:#0b0d0f;overflow:hidden}
  #c{display:block;width:1920px;height:1080px}
</style>
</head>
<body>
<canvas id="c" width="1920" height="1080"></canvas>
<script>
// ------------------------------------------------------------------
// Stonebrook Deal Scout — 30 second promo. Deterministic canvas render.
// renderFrame(t) draws the full frame for time t (seconds, 0..30).
// All figures are the real values the app produces for the demo data.
// ------------------------------------------------------------------
const W = 1920, H = 1080;
const cv = document.getElementById('c');
const g = cv.getContext('2d');

// Institutional palette (matches tailwind.config.js)
const INK='#0b0d0f', CHARCOAL='#16191d', GRAPHITE='#22262c', SLATE='#2e343c';
const MIST='#8b929c', FOG='#c7ccd3', GOLD='#c8a95a', GOLDSOFT='#a4894a';
const APPROVE='#4f9d69', DANGER='#b4544b', PAPER='#eef0f2';
const SERIF="Georgia, 'Times New Roman', serif";
const SANS="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif";

// ---- math helpers ----
const clamp=(v,a=0,b=1)=>Math.max(a,Math.min(b,v));
const lerp=(a,b,t)=>a+(b-a)*t;
const easeOutCubic=t=>1-Math.pow(1-t,3);
const easeInOutCubic=t=>t<0.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
const easeOutExpo=t=>t>=1?1:1-Math.pow(2,-10*t);
// eased progress of a sub-clip [start,start+dur] at local time lt
const ep=(lt,start,dur,ease=easeOutCubic)=>ease(clamp((lt-start)/dur,0,1));

function hex(c,a){ // add alpha to #rrggbb
  const r=parseInt(c.slice(1,3),16),gg=parseInt(c.slice(3,5),16),b=parseInt(c.slice(5,7),16);
  return `rgba(${r},${gg},${b},${a})`;
}

// ---- text helpers ----
function setFont(size,weight,family){ g.font=`${weight} ${size}px ${family}`; }
function measureSpaced(str,spacing){
  let w=0; for(const ch of str){ w+=g.measureText(ch).width+spacing; }
  return w-spacing;
}
function text(str,x,y,{size=48,weight=400,family=SANS,color=FOG,align='center',alpha=1,spacing=0}={}){
  if(alpha<=0)return;
  g.save(); g.globalAlpha*=alpha; setFont(size,weight,family); g.fillStyle=color;
  g.textBaseline='alphabetic';
  if(spacing===0){ g.textAlign=align; g.fillText(str,x,y); }
  else{
    const total=measureSpaced(str,spacing);
    let sx = align==='center'? x-total/2 : align==='right'? x-total : x;
    g.textAlign='left';
    for(const ch of str){ g.fillText(ch,sx,y); sx+=g.measureText(ch).width+spacing; }
  }
  g.restore();
}
function roundRect(x,y,w,h,r){
  g.beginPath();
  g.moveTo(x+r,y); g.arcTo(x+w,y,x+w,y+h,r); g.arcTo(x+w,y+h,x,y+h,r);
  g.arcTo(x,y+h,x,y,r); g.arcTo(x,y,x+w,y,r); g.closePath();
}

// ---- persistent background ----
function background(t){
  const grad=g.createLinearGradient(0,0,0,H);
  grad.addColorStop(0,'#15181c'); grad.addColorStop(0.55,INK); grad.addColorStop(1,'#08090b');
  g.fillStyle=grad; g.fillRect(0,0,W,H);

  // subtle skyline motif — thin rising bars, low opacity (real-estate / value rising)
  const base=H-2, maxH=190;
  g.save();
  for(let i=0;i<64;i++){
    const seed=(i*97%31)/31;
    const bw=W/64, x=i*bw;
    const rise=easeInOutCubic(clamp((t-1.2- seed*1.5)/6,0,1));
    const bh=(24+seed*maxH)*rise;
    const gold=(i%11===4);
    g.fillStyle= gold? hex(GOLD,0.08) : hex(SLATE,0.16+seed*0.06);
    g.fillRect(x+2,base-bh,bw-4,bh);
  }
  g.restore();

  // vignette
  const vg=g.createRadialGradient(W/2,H*0.46,H*0.25,W/2,H*0.5,W*0.72);
  vg.addColorStop(0,'rgba(0,0,0,0)'); vg.addColorStop(1,'rgba(0,0,0,0.62)');
  g.fillStyle=vg; g.fillRect(0,0,W,H);
}

// gold hairline that draws in from center
function hairline(y,frac,{width=520,alpha=1,color=GOLD}={}){
  const half=width/2*easeOutExpo(frac);
  g.save(); g.globalAlpha=alpha;
  const lg=g.createLinearGradient(W/2-half,0,W/2+half,0);
  lg.addColorStop(0,hex(color,0)); lg.addColorStop(0.5,hex(color,0.9)); lg.addColorStop(1,hex(color,0));
  g.strokeStyle=lg; g.lineWidth=2;
  g.beginPath(); g.moveTo(W/2-half,y); g.lineTo(W/2+half,y); g.stroke();
  g.restore();
}

// keystone monogram (Stonebrook mark)
function keystone(cx,cy,s,frac,alpha){
  g.save(); g.globalAlpha=alpha; g.translate(cx,cy);
  const draw=easeOutCubic(frac);
  g.strokeStyle=hex(GOLD,0.95); g.lineWidth=3; g.lineJoin='round';
  const topW=s*0.62, botW=s*1.0, h=s*0.92;
  g.beginPath();
  g.moveTo(-topW/2,-h/2); g.lineTo(topW/2,-h/2);
  g.lineTo(botW/2,h/2); g.lineTo(-botW/2,h/2); g.closePath();
  g.save(); g.globalAlpha=alpha*draw; g.stroke(); g.restore();
  // inner engraved line
  g.strokeStyle=hex(GOLDSOFT,0.7); g.lineWidth=1.5;
  g.globalAlpha=alpha*draw;
  g.beginPath();
  g.moveTo(-topW/2*0.6,-h/2+14); g.lineTo(topW/2*0.6,-h/2+14);
  g.lineTo(botW/2*0.6,h/2-14); g.lineTo(-botW/2*0.6,h/2-14); g.closePath(); g.stroke();
  g.restore();
}

// score ring: value/100, animated fraction, counting number
function scoreRing(cx,cy,r,value,frac,{ring=GOLD,label='',tone=APPROVE,pill=''}={}){
  const shown=Math.round(value*easeOutCubic(frac));
  const sweep=(value/100)*easeOutCubic(frac);
  g.save();
  // track
  g.strokeStyle=hex(SLATE,0.9); g.lineWidth=16; g.lineCap='round';
  g.beginPath(); g.arc(cx,cy,r,0,Math.PI*2); g.stroke();
  // value arc
  g.strokeStyle=ring; g.lineWidth=16; g.lineCap='round';
  g.beginPath(); g.arc(cx,cy,r,-Math.PI/2,-Math.PI/2+Math.PI*2*sweep); g.stroke();
  // glow tip
  const ang=-Math.PI/2+Math.PI*2*sweep;
  g.fillStyle=hex(ring,0.9); g.beginPath(); g.arc(cx+Math.cos(ang)*r,cy+Math.sin(ang)*r,9,0,Math.PI*2); g.fill();
  g.restore();
  text(String(shown),cx,cy+30,{size:150,weight:600,family:SERIF,color:PAPER,align:'center'});
  text('/ 100',cx,cy+80,{size:30,weight:500,family:SANS,color:MIST,align:'center',spacing:2});
  if(label) text(label,cx,cy-r-46,{size:26,weight:600,family:SANS,color:GOLD,align:'center',spacing:6});
  if(pill){
    const pw=g.measureText? 0:0;
    setFont(30,600,SANS); const w=g.measureText(pill).width+56;
    const py=cy+r+70;
    g.save(); roundRect(cx-w/2,py-38,w,54,27); g.fillStyle=hex(tone,0.16); g.fill();
    g.strokeStyle=hex(tone,0.8); g.lineWidth=1.5; g.stroke(); g.restore();
    text(pill,cx,py,{size:30,weight:600,family:SANS,color:tone,align:'center',spacing:1});
  }
}

// stat chip
function chip(cx,cy,w,h,top,bottom,frac,accent=GOLD){
  const a=easeOutCubic(frac); if(a<=0)return;
  const oy=(1-a)*24;
  g.save(); g.globalAlpha=a; g.translate(0,oy);
  roundRect(cx-w/2,cy-h/2,w,h,14); g.fillStyle=hex(GRAPHITE,0.85); g.fill();
  g.strokeStyle=hex(SLATE,0.9); g.lineWidth=1.5; g.stroke();
  // accent tick
  g.fillStyle=accent; roundRect(cx-w/2,cy-h/2,5,h,3); g.fill();
  g.restore();
  text(top,cx+8,cy-4,{size:40,weight:600,family:SERIF,color:PAPER,align:'center',alpha:a});
  text(bottom,cx+8,cy+34,{size:22,weight:500,family:SANS,color:MIST,align:'center',alpha:a,spacing:1});
}

// envelope for a scene: fade in / hold / fade out
function envelope(lt,dur,fin=0.5,fout=0.45){
  return clamp(lt/fin,0,1)*clamp((dur-lt)/fout,0,1);
}

// ================= SCENES =================
const SCENES=[
  {start:0.0, dur:4.6, draw:sceneHook},
  {start:4.6, dur:4.2, draw:sceneProblem},
  {start:8.8, dur:4.0, draw:sceneBrand},
  {start:12.8,dur:5.4, draw:sceneMarket},
  {start:18.2,dur:5.8, draw:sceneProperty},
  {start:24.0,dur:3.9, draw:sceneValue},
  {start:27.9,dur:2.1, draw:sceneCTA},
];

function sceneHook(lt,dur){
  const a=envelope(lt,dur,0.6,0.5);
  text('3 HOURS OF UNDERWRITING.',W/2,H/2-40,{size:78,weight:600,family:SERIF,color:PAPER,align:'center',alpha:a*ep(lt,0.1,0.9)});
  hairline(H/2+18, ep(lt,0.5,1.0), {width:640,alpha:a});
  text('A deal that was dead on arrival.',W/2,H/2+96,{size:40,weight:400,family:SANS,color:MIST,align:'center',alpha:a*ep(lt,0.9,1.0),spacing:2});
}

function sceneProblem(lt,dur){
  const a=envelope(lt,dur);
  // funnel of dots: many fall away, one turns gold
  const cx=W/2, top=H/2-210;
  const n=28;
  for(let i=0;i<n;i++){
    const col=i%7, row=Math.floor(i/7);
    const x=cx-3*70+col*70+ (row%2?35:0);
    const winner=(i===18);
    const fall=ep(lt,0.4+ (i*0.02),1.4);
    const y=top+row*46 + fall*(winner?150:360);
    const alive= winner? 1 : (1-fall);
    const col2= winner? GOLD : (fall>0.5?DANGER:MIST);
    g.save(); g.globalAlpha=a*(winner?1:0.65*alive+0.15);
    g.fillStyle=hex(col2, winner?0.95:0.6);
    g.beginPath(); g.arc(x,y,winner?12:8,0,Math.PI*2); g.fill();
    if(winner){ g.strokeStyle=hex(GOLD,0.5); g.lineWidth=2; g.beginPath(); g.arc(x,y,20+Math.sin(lt*4)*3,0,Math.PI*2); g.stroke(); }
    g.restore();
  }
  text('Most value-add deals die in underwriting.',W/2,H/2+250,{size:52,weight:600,family:SERIF,color:PAPER,align:'center',alpha:a*ep(lt,0.5,1.0)});
  text("The few winners hide behind the broker's pro forma.",W/2,H/2+312,{size:32,weight:400,family:SANS,color:MIST,align:'center',alpha:a*ep(lt,1.0,1.0),spacing:1});
}

function sceneBrand(lt,dur){
  const a=envelope(lt,dur,0.55,0.5);
  keystone(W/2,H/2-150,150,ep(lt,0.15,1.1),a);
  text('STONEBROOK',W/2,H/2+30,{size:96,weight:600,family:SERIF,color:GOLD,align:'center',alpha:a*ep(lt,0.5,0.9),spacing:10});
  text('DEAL SCOUT',W/2,H/2+108,{size:52,weight:500,family:SANS,color:FOG,align:'center',alpha:a*ep(lt,0.75,0.9),spacing:24});
  hairline(H/2+164, ep(lt,0.9,1.0), {width:560,alpha:a});
  text('Screen the deal before you underwrite it.',W/2,H/2+232,{size:34,weight:400,family:SANS,color:MIST,align:'center',alpha:a*ep(lt,1.1,1.0),spacing:2});
}

function sceneMarket(lt,dur){
  const a=envelope(lt,dur);
  scoreRing(W/2, H/2-30, 200, 84, ep(lt,0.3,2.0), {ring:GOLD,label:'MARKET GATE',tone:APPROVE,pill:'APPROVED'});
  text('Greenville–Spartanburg, SC',W/2,H/2+320,{size:40,weight:600,family:SERIF,color:PAPER,align:'center',alpha:a*ep(lt,0.8,1.0)});
  text('Emerging Sunbelt corridor · reshoring anchors · disciplined supply',W/2,H/2+368,{size:26,weight:400,family:SANS,color:MIST,align:'center',alpha:a*ep(lt,1.1,1.0),spacing:1});
}

function sceneProperty(lt,dur){
  const a=envelope(lt,dur);
  scoreRing(W/2, H/2-110, 170, 86, ep(lt,0.25,1.8), {ring:GOLD,label:'PROPERTY SCRATCH SCORE',tone:APPROVE,pill:'STRONG LEAD'});
  text('Oakbridge Commons',W/2,H/2+200,{size:40,weight:600,family:SERIF,color:PAPER,align:'center',alpha:a*ep(lt,0.7,1.0)});
  text('96 units · Class C in a B pocket · rents 23% under market',W/2,H/2+244,{size:24,weight:400,family:SANS,color:MIST,align:'center',alpha:a*ep(lt,0.95,1.0),spacing:1});
  const cy=H/2+352, cw=380, ch=110, gap=26;
  chip(W/2-cw-gap, cy, cw, ch, '$90K / unit','ASKING BASIS', ep(lt,1.2,0.8), GOLD);
  chip(W/2,        cy, cw, ch, '+$288K / yr','RENT UPSIDE', ep(lt,1.45,0.8), APPROVE);
  chip(W/2+cw+gap, cy, cw, ch, '5.3% → 8.7%','STABILIZED CAP', ep(lt,1.7,0.8), GOLD);
}

function sceneValue(lt,dur){
  const a=envelope(lt,dur,0.5,0.45);
  const val=2.63*easeOutExpo(ep(lt,0.2,1.6,t=>t));
  text('$'+val.toFixed(2)+'M',W/2,H/2+20,{size:180,weight:600,family:SERIF,color:GOLD,align:'center',alpha:a});
  text('VALUE CREATED',W/2,H/2-190,{size:32,weight:600,family:SANS,color:MIST,align:'center',alpha:a*ep(lt,0.1,0.8),spacing:10});
  hairline(H/2+90, ep(lt,0.6,1.0), {width:620,alpha:a});
  text('Stabilized value $13.0M   ·   all-in basis $10.4M',W/2,H/2+156,{size:30,weight:400,family:SANS,color:FOG,align:'center',alpha:a*ep(lt,0.9,1.0),spacing:1});
}

function sceneCTA(lt,dur){
  const a=envelope(lt,dur,0.5,0.55);
  keystone(W/2,H/2-140,110,1,a*0.9);
  text('STONEBROOK DEAL SCOUT',W/2,H/2+10,{size:70,weight:600,family:SERIF,color:GOLD,align:'center',alpha:a,spacing:6});
  text('Know in 90 seconds. Underwrite only the winners.',W/2,H/2+92,{size:36,weight:400,family:SANS,color:FOG,align:'center',alpha:a*ep(lt,0.3,0.9),spacing:1});
}

// ================= MASTER =================
function renderFrame(t){
  g.globalAlpha=1;
  background(t);
  for(const s of SCENES){
    const lt=t-s.start;
    if(lt>=0 && lt<=s.dur){ g.save(); s.draw(lt,s.dur); g.restore(); }
  }
  // thin frame border for a finished feel
  g.strokeStyle=hex(GOLD,0.10); g.lineWidth=2; g.strokeRect(28,28,W-56,H-56);
}
window.renderFrame=renderFrame;

// live preview when opened in a browser
let _live=null;
function loop(ts){ if(_live===null)_live=ts; renderFrame(((ts-_live)/1000)%30); requestAnimationFrame(loop); }
if(!window.__CAPTURE__) requestAnimationFrame(loop);
</script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
</head>
<body>
<title>Riffle</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,700;1,9..144,500&family=Crimson+Pro:ital,wght@0,400;0,600;1,400&family=Archivo:wght@400;500;600&display=swap">
<style>
  /* ——— Riffle: a flip-book for notes. Single committed theme: a lamplit desk. ——— */
  :root{
    --desk:#241f1a;          /* dark umber desk */
    --desk-edge:#1a1613;
    --leather:#5a2e28;       /* oxblood cover */
    --leather-dk:#41211d;
    --paper:#fbf6ea;         /* page face */
    --paper-dim:#f2ebda;     /* page verso / blank */
    --paper-edge:#e6dcc4;
    --ink:#2b2620;           /* writing ink */
    --ink-soft:#7a6f5d;
    --brass:#c9a15a;         /* UI accent on dark */
    --parch:#e9dfca;         /* UI text on dark */
    --parch-dim:#a89a7f;
    --ui:"Archivo",system-ui,sans-serif;
    --serif:"Crimson Pro",Georgia,serif;
    --disp:"Fraunces",Georgia,serif;
  }
  *{box-sizing:border-box;margin:0}
  html,body{height:100%}
  body{
    background:radial-gradient(120% 90% at 50% 0%, #2c2620 0%, var(--desk) 55%, var(--desk-edge) 100%);
    color:var(--parch);
    font-family:var(--ui);
    overflow-x:hidden;
  }
  button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
  :focus-visible{outline:2px solid var(--brass);outline-offset:2px;border-radius:3px}

  /* ——— top bar ——— */
  .topbar{
    display:flex;align-items:center;gap:16px;flex-wrap:wrap;
    padding:14px 22px 10px;position:relative;z-index:60;
  }
  .brand{display:flex;align-items:baseline;gap:10px;margin-right:6px}
  .brand h1{font-family:var(--disp);font-weight:700;font-size:26px;letter-spacing:.01em;color:var(--parch)}
  .brand em{font-family:var(--disp);font-style:italic;font-weight:500;font-size:13px;color:var(--parch-dim)}
  .searchbox{position:relative;flex:1 1 240px;max-width:430px}
  .searchbox input{
    width:100%;padding:9px 14px 9px 34px;border-radius:999px;
    border:1px solid #4a4032;background:#2e2822;color:var(--parch);
    font:14px var(--ui);
  }
  .searchbox input::placeholder{color:var(--parch-dim)}
  .searchbox .sicon{position:absolute;left:12px;top:50%;translate:0 -50%;color:var(--parch-dim);pointer-events:none}
  .sresults{
    position:absolute;top:calc(100% + 8px);left:0;right:0;z-index:80;
    background:var(--paper);color:var(--ink);border-radius:10px;
    box-shadow:0 18px 40px rgba(0,0,0,.5);overflow:hidden;display:none;
  }
  .sresults.open{display:block}
  .sr{display:block;width:100%;text-align:left;padding:10px 14px;border-bottom:1px solid #e8e0cd}
  .sr:last-child{border-bottom:0}
  .sr:hover,.sr.sel{background:#f1e9d6}
  .sr .srt{font-family:var(--disp);font-weight:600;font-size:14.5px;display:flex;align-items:center;gap:8px}
  .sr .srs{font:13px/1.45 var(--serif);color:#5d5343}
  .sr mark{background:#f3d98f;color:inherit;padding:0 1px;border-radius:2px}
  .srpg{margin-left:auto;font-size:11px;color:var(--ink-soft);font-family:var(--ui)}
  .dotc{width:8px;height:8px;border-radius:50%;background:var(--tc,#888);flex:none}
  .topacts{display:flex;gap:10px;margin-left:auto}
  .tbtn{
    display:inline-flex;align-items:center;gap:7px;
    padding:8px 15px;border-radius:999px;font-size:13.5px;font-weight:500;
    border:1px solid #4a4032;color:var(--parch);
  }
  .tbtn:hover{border-color:var(--brass);color:#fff}
  .tbtn.primary{background:var(--brass);border-color:var(--brass);color:#241f1a;font-weight:600}
  .tbtn.primary:hover{background:#d8b26c}

  /* ——— stage & book ——— */
  .stage{display:flex;flex-direction:column;align-items:center;padding:10px 16px 26px}
  .bookwrap{position:relative;margin-right:96px} /* room for tabs */
  .book{
    position:relative;
    width:min(980px, calc(100vw - 170px));
    height:min(620px, calc(100dvh - 190px));
    min-height:430px;
    perspective:2200px;
  }
  .book::before{
    content:"";position:absolute;inset:-12px -14px -16px -14px;border-radius:10px;
    background:linear-gradient(160deg, #6b3831 0%, var(--leather) 40%, var(--leather-dk) 100%);
    box-shadow:0 30px 60px rgba(0,0,0,.55), inset 0 1px 0 rgba(255,255,255,.12);
  }
  .edge{position:absolute;top:6px;bottom:8px;width:14px;border-radius:2px;
    background:repeating-linear-gradient(90deg, var(--paper-edge) 0 1px, #f4eddb 1px 3px);
    box-shadow:inset 0 0 6px rgba(120,100,60,.25);
  }
  .edge.l{left:0;transform-origin:right center;transform:skewY(1.2deg)}
  .edge.r{right:0;transform-origin:left center;transform:skewY(-1.2deg)}

  .pstatic{position:absolute;top:0;bottom:0;width:50%;z-index:1}
  .pstatic.l{left:0}
  .pstatic.r{right:0}

  .spinesh{position:absolute;top:0;bottom:0;left:50%;width:0;z-index:5;pointer-events:none}
  .spinesh::before,.spinesh::after{content:"";position:absolute;top:0;bottom:0;width:56px;pointer-events:none}
  .spinesh::before{right:0;background:linear-gradient(to left, rgba(90,70,40,.28), transparent)}
  .spinesh::after{left:0;background:linear-gradient(to right, rgba(90,70,40,.22), transparent)}

  /* ——— a page face ——— */
  .pface{
    position:absolute;inset:0;display:flex;flex-direction:column;
    background:
      linear-gradient(180deg, rgba(255,255,255,.35), transparent 60px),
      var(--paper);
    color:var(--ink);
    padding:24px 28px 14px;
    overflow:hidden;
  }
  .pstatic.l .pface{border-radius:6px 0 0 6px;box-shadow:inset -14px 0 22px -16px rgba(90,70,40,.5)}
  .pstatic.r .pface{border-radius:0 6px 6px 0;box-shadow:inset 14px 0 22px -16px rgba(90,70,40,.5)}
  .pface.blank{background:var(--paper-dim)}
  .pface.droptarget::after{
    content:"Drop files on this page";
    position:absolute;inset:8px;border:2px dashed var(--brass);border-radius:8px;
    display:flex;align-items:center;justify-content:center;
    font:600 14px var(--ui);color:#8a6a2f;background:rgba(251,246,234,.88);
    pointer-events:none;
  }
  .p-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
  .p-chip{
    font:11px/1 var(--ui);font-weight:600;letter-spacing:.08em;text-transform:uppercase;
    color:#fff;background:var(--tc,#777);padding:4px 9px;border-radius:3px;
  }
  .p-num{font:12px var(--ui);color:var(--ink-soft);font-variant-numeric:tabular-nums}
  .p-title{
    font-family:var(--disp);font-weight:600;font-size:clamp(18px,2.2vw,23px);
    line-height:1.2;text-wrap:balance;margin-bottom:8px;outline:none;
  }
  .p-scroll{flex:1;overflow-y:auto;padding-right:6px;display:flex;flex-direction:column;gap:10px}
  .p-body{
    font:15.5px/1.6 var(--serif);outline:none;min-height:1.6em;
  }
  .p-body p{margin:0 0 .7em}
  .p-body ul,.p-body ol{margin:0 0 .7em 1.2em}
  .p-body h3{font-family:var(--disp);font-size:15px;margin:.6em 0 .3em}
  .p-body svg{max-width:100%;height:auto}
  [data-ph]:empty::before{content:attr(data-ph);color:#b3a98f;font-style:italic}
  .p-foot{display:flex;align-items:center;justify-content:space-between;padding-top:7px;border-top:1px solid #e8dfca}
  .p-date{font:11.5px var(--ui);color:var(--ink-soft)}
  .p-acts{display:flex;gap:2px;opacity:.45;transition:opacity .15s}
  .pface:hover .p-acts{opacity:1}
  .pa{padding:4px 7px;border-radius:5px;color:var(--ink-soft);font-size:13px;white-space:nowrap}
  .pa:hover{background:#ece3cd;color:var(--ink)}

  /* ——— media tiles on a page ——— */
  .p-media{display:flex;flex-wrap:wrap;gap:8px;align-content:flex-start}
  .tile{
    position:relative;border-radius:5px;cursor:zoom-in;flex:none;
    background:#fff;border:1px solid #ddd2b6;
    box-shadow:0 2px 6px rgba(90,70,40,.18);
    overflow:hidden;
  }
  .tile.s{width:58px}
  .tile.m{width:116px}
  .tile.l{width:212px}
  .tile .thumb{display:block;width:100%;aspect-ratio:4/3;object-fit:cover;background:#efe9da}
  .tile .doccard{
    width:100%;aspect-ratio:4/3;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:5px;background:#f6f1e3;
  }
  .tile .extb{
    font:700 10px/1 var(--ui);letter-spacing:.06em;color:#fff;
    background:var(--ec,#6b6252);padding:4px 7px;border-radius:3px;text-transform:uppercase;
  }
  .tile.s .extb{padding:3px 5px;font-size:8px}
  .tile .docg{font-size:20px;line-height:1}
  .tile.s .docg{font-size:13px}
  .tile figcaption{
    font:10.5px/1.3 var(--ui);color:var(--ink-soft);padding:4px 6px;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .tile.s figcaption{display:none}
  .tile.dragging{opacity:.4}
  .tile.dropbefore{outline:2px solid var(--brass);outline-offset:1px}
  .tacts{
    position:absolute;top:3px;right:3px;display:flex;gap:2px;
    opacity:0;transition:opacity .12s;
  }
  .tile:hover .tacts{opacity:1}
  .ta{
    width:19px;height:19px;display:flex;align-items:center;justify-content:center;
    background:rgba(30,25,18,.72);color:#f3ecd9;border-radius:4px;font-size:11px;line-height:1;
  }
  .ta:hover{background:rgba(30,25,18,.92)}

  /* click zones to flip */
  .fzone{position:absolute;top:0;bottom:0;width:56px;z-index:20;cursor:pointer}
  .fzone.l{left:-6px}
  .fzone.r{right:-6px}
  .fzone::after{
    content:"";position:absolute;bottom:10px;width:26px;height:26px;border-radius:50%;
    opacity:0;transition:opacity .15s;
    background:rgba(120,95,50,.18);
  }
  .fzone.l::after{left:12px}
  .fzone.r::after{right:12px}
  .fzone:hover::after{opacity:1}

  /* ——— the animated leaf ——— */
  .leaf{
    position:absolute;top:0;bottom:0;left:50%;width:50%;z-index:50;
    transform-style:preserve-3d;transform-origin:left center;
  }
  .leaf .lf{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden}
  .leaf .lf .pface{position:absolute;inset:0}
  .leaf .front .pface{border-radius:0 6px 6px 0;box-shadow:inset 14px 0 22px -16px rgba(90,70,40,.5)}
  .leaf .back{transform:rotateY(180deg)}
  .leaf .back .pface{border-radius:6px 0 0 6px;box-shadow:inset -14px 0 22px -16px rgba(90,70,40,.5)}
  .leaf .shade{position:absolute;inset:0;background:linear-gradient(to right, rgba(60,45,20,.35), transparent 55%);opacity:0;pointer-events:none}

  /* ——— tabs rail ——— */
  .tabs{position:absolute;left:100%;top:34px;display:flex;flex-direction:column;gap:10px;z-index:8}
  .tab{
    display:flex;align-items:center;
    color:#fff;background:var(--tc,#777);
    font:12px/1 var(--ui);font-weight:600;letter-spacing:.05em;
    padding:9px 14px 9px 18px;border-radius:0 6px 6px 0;
    margin-left:-4px;max-width:120px;
    box-shadow:3px 3px 8px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.25);
    filter:saturate(.85) brightness(.92);
    transition:transform .15s, filter .15s;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .tab:hover{transform:translateX(4px);filter:none}
  .tab.active{transform:translateX(6px);filter:none;box-shadow:4px 4px 10px rgba(0,0,0,.4), inset 0 1px 0 rgba(255,255,255,.3)}

  /* ——— pager ——— */
  .pager{display:flex;align-items:center;gap:18px;margin-top:20px;font-size:13px;color:var(--parch-dim)}
  .pager b{color:var(--parch);font-weight:500;font-variant-numeric:tabular-nums}
  .pgbtn{padding:6px 13px;border:1px solid #4a4032;border-radius:999px;font-size:13px;color:var(--parch)}
  .pgbtn:hover{border-color:var(--brass);color:#fff}
  .pgbtn:disabled{opacity:.35;cursor:default}
  .hint{margin-top:8px;font-size:11.5px;color:#6f6553;text-align:center;max-width:640px}

  /* ——— dialogs ——— */
  dialog{
    border:0;border-radius:12px;padding:0;background:var(--paper);color:var(--ink);
    box-shadow:0 30px 80px rgba(0,0,0,.6);width:min(340px,90vw);
  }
  dialog::backdrop{background:rgba(15,12,9,.55)}
  .dlg{padding:22px 22px 18px;font-family:var(--ui)}
  .dlg h2{font-family:var(--disp);font-size:19px;margin-bottom:14px}
  .dlg label{display:block;font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-soft);margin-bottom:6px}
  .dlg input[type=text]{
    width:100%;padding:9px 12px;border:1px solid #cfc4a8;border-radius:8px;
    background:#fff;font:14px var(--ui);color:var(--ink);margin-bottom:14px;
  }
  .swatches{display:flex;gap:9px;margin-bottom:18px}
  .sw{width:30px;height:30px;border-radius:50%;border:3px solid transparent}
  .sw.sel{border-color:var(--ink)}
  .dlgacts{display:flex;justify-content:flex-end;gap:10px}
  .dbtn{padding:8px 16px;border-radius:8px;font-size:13.5px;font-weight:500}
  .dbtn.ghost{color:var(--ink-soft)}
  .dbtn.go{background:var(--ink);color:var(--paper);font-weight:600}
  .mvlist{max-height:280px;overflow-y:auto;margin:0 -6px 12px;padding:0 6px}
  .mv{display:flex;align-items:center;gap:9px;width:100%;text-align:left;padding:8px 10px;border-radius:7px;font-size:13.5px}
  .mv:hover{background:#efe7d2}
  .mv .mnum{margin-left:auto;font-size:11px;color:var(--ink-soft);font-variant-numeric:tabular-nums}

  /* ——— lightbox ——— */
  .lightbox{
    position:fixed;inset:0;z-index:200;display:none;flex-direction:column;
    background:rgba(18,15,11,.93);
  }
  .lightbox.open{display:flex}
  .lb-top{display:flex;align-items:center;gap:12px;padding:12px 18px;color:var(--parch)}
  .lb-name{font:14px var(--ui);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .lb-meta{font:12px var(--ui);color:var(--parch-dim);white-space:nowrap}
  .lb-close{margin-left:auto;font-size:20px;padding:4px 10px;color:var(--parch)}
  .lb-close:hover{color:#fff}
  .lb-stage{
    flex:1;overflow:auto;display:flex;align-items:center;justify-content:center;
    padding:10px 64px;position:relative;
  }
  .lb-img{max-width:100%;max-height:calc(100dvh - 150px);cursor:zoom-in;border-radius:4px;box-shadow:0 20px 60px rgba(0,0,0,.6)}
  .lb-img.full{max-width:none;max-height:none;cursor:zoom-out}
  .lb-stage.scrolly{display:block;text-align:center}
  .lb-frame{width:min(920px,92vw);height:calc(100dvh - 160px);border:0;background:#fff;border-radius:6px}
  .lb-video{max-width:92vw;max-height:calc(100dvh - 160px)}
  .lb-card{
    background:var(--paper);color:var(--ink);border-radius:12px;padding:38px 42px;
    display:flex;flex-direction:column;align-items:center;gap:12px;max-width:400px;text-align:center;
  }
  .lb-card .extb{font:700 13px/1 var(--ui);letter-spacing:.06em;color:#fff;background:var(--ec,#6b6252);padding:7px 12px;border-radius:5px;text-transform:uppercase}
  .lb-card p{font:14px/1.5 var(--ui);color:#5d5343}
  .lb-nav{
    position:absolute;top:50%;translate:0 -50%;z-index:5;
    font-size:30px;color:var(--parch);padding:16px 12px;opacity:.7;
  }
  .lb-nav:hover{opacity:1}
  .lb-nav.p{left:8px}.lb-nav.n{right:8px}
  .lb-bar{display:flex;justify-content:center;gap:12px;padding:12px 18px 18px}
  .lbb{
    padding:8px 16px;border:1px solid #4a4032;border-radius:999px;
    font-size:13px;color:var(--parch);
  }
  .lbb:hover{border-color:var(--brass);color:#fff}
  .lbb.warn:hover{border-color:#b3573f;color:#e8a08c}

  .toast{
    position:fixed;left:50%;bottom:26px;translate:-50% 0;z-index:300;
    background:var(--paper);color:var(--ink);font:13.5px var(--ui);
    padding:10px 18px;border-radius:999px;box-shadow:0 12px 30px rgba(0,0,0,.5);
    opacity:0;transition:opacity .25s;pointer-events:none;
  }
  .toast.on{opacity:1}

  /* ——— narrow screens: single page, tabs on top ——— */
  @media (max-width:860px){
    .topbar{padding:12px 14px 8px}
    .bookwrap{margin-right:0;width:100%}
    .book{width:min(560px,calc(100vw - 40px));margin:0 auto;height:min(600px,calc(100dvh - 240px))}
    .pstatic.l,.edge.l,.spinesh{display:none}
    .pstatic.r{left:0;right:0;width:100%}
    .pstatic.r .pface{border-radius:6px}
    .leaf{left:0;width:100%}
    .tabs{position:static;flex-direction:row;flex-wrap:wrap;gap:8px;justify-content:center;margin:0 0 12px;max-width:calc(100vw - 30px)}
    .tab{border-radius:6px;margin-left:0;padding:8px 12px}
    .tab:hover,.tab.active{transform:translateY(-2px)}
    .pface{padding:20px 20px 12px}
    .lb-stage{padding:10px 8px}
  }
  @media (prefers-reduced-motion:reduce){
    .tab,.fzone::after,.p-acts,.tacts{transition:none}
  }
</style>

<header class="topbar">
  <div class="brand"><h1>Riffle</h1><em>a flip-book for everything you write down</em></div>
  <div class="searchbox">
    <span class="sicon">⌕</span>
    <input id="q" type="search" placeholder="Search every page… then riffle right to it" autocomplete="off">
    <div class="sresults" id="sres"></div>
  </div>
  <div class="topacts">
    <button class="tbtn" id="newTabBtn">+ New tab</button>
    <button class="tbtn primary" id="newPageBtn">＋ New page</button>
  </div>
</header>

<main class="stage">
  <div class="bookwrap">
    <div class="tabs" id="tabs"></div>
    <div class="book" id="book">
      <div class="edge l" id="edgeL"></div>
      <div class="edge r" id="edgeR"></div>
      <div class="pstatic l" id="statL"></div>
      <div class="pstatic r" id="statR"></div>
      <div class="spinesh"></div>
      <div class="fzone l" id="fzL" title="Previous page"></div>
      <div class="fzone r" id="fzR" title="Next page"></div>
    </div>
  </div>
  <div class="pager">
    <button class="pgbtn" id="prevBtn">‹ Back</button>
    <span id="pagerTxt"><b>–</b></span>
    <button class="pgbtn" id="nextBtn">Turn ›</button>
  </div>
  <div class="hint">Drop files anywhere on a page — slides, photos, PDFs, decks. Click a thumbnail to blow it up; hover it to grow, shrink, move, or save it. ← → flips. Everything saves as you go.</div>
</main>

<input type="file" id="fileInput" multiple hidden>

<dialog id="tabDlg">
  <form class="dlg" method="dialog">
    <h2>New tab</h2>
    <label for="tabName">Tab name</label>
    <input type="text" id="tabName" placeholder="e.g. Q3 Pipeline" maxlength="24">
    <label>Tab color</label>
    <div class="swatches" id="swatches"></div>
    <div class="dlgacts">
      <button class="dbtn ghost" value="cancel">Cancel</button>
      <button class="dbtn go" id="tabGo" value="go">Create tab</button>
    </div>
  </form>
</dialog>

<dialog id="moveDlg">
  <div class="dlg">
    <h2>Move to page…</h2>
    <div class="mvlist" id="mvList"></div>
    <div class="dlgacts"><button class="dbtn ghost" id="mvCancel">Cancel</button></div>
  </div>
</dialog>

<div class="lightbox" id="lb">
  <div class="lb-top">
    <span class="lb-name" id="lbName"></span>
    <span class="lb-meta" id="lbMeta"></span>
    <button class="lb-close" id="lbClose" title="Close">✕</button>
  </div>
  <div class="lb-stage" id="lbStage">
    <button class="lb-nav p" id="lbPrev" title="Previous">‹</button>
    <button class="lb-nav n" id="lbNext" title="Next">›</button>
  </div>
  <div class="lb-bar">
    <button class="lbb" id="lbSave">Save file</button>
    <button class="lbb" id="lbMove">Move to page…</button>
    <button class="lbb warn" id="lbDel">Remove from book</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
(function(){
"use strict";
const LS="riffle.book.v1";
const COLORS=["#8c3b2e","#3e5c76","#5b6e3a","#c08a2d","#5c4a72","#2f6b5e"];
const EXTC={ppt:"#c0432e",pptx:"#c0432e",key:"#c0432e",doc:"#2b5797",docx:"#2b5797",xls:"#1e7145",xlsx:"#1e7145",csv:"#1e7145",pdf:"#b30b00",zip:"#6b6252",txt:"#6b6252"};

/* ——— state ——— */
let book;
try{book=JSON.parse(localStorage.getItem(LS))||null;}catch(e){book=null;}
if(!book||!Array.isArray(book.pages)||!book.pages.length) book=seed();
book.pages.forEach(p=>{if(!Array.isArray(p.items))p.items=[];});
function save(){try{localStorage.setItem(LS,JSON.stringify(book));}catch(e){toast("Couldn't save — storage is full");}}
let saveT;const saveSoon=()=>{clearTimeout(saveT);saveT=setTimeout(save,400);};

const mq=matchMedia("(max-width:860px)");
let stride=mq.matches?1:2;
let s=0;
let flipping=false;

const N=()=>book.pages.length;
const maxS=()=>stride===2?Math.max(0,Math.ceil(N()/2)-1):N()-1;
const leftIdx=sp=>stride===2?sp*2:-1;
const rightIdx=sp=>stride===2?sp*2+1:sp;
const spreadOf=i=>stride===2?Math.floor(i/2):i;
const secById=id=>book.sections.find(x=>x.id===id)||{name:"?",color:"#777"};
const curPageIdx=()=>{const r=rightIdx(s);return r<N()?r:Math.max(0,Math.min(leftIdx(s),N()-1));};

/* ——— file blob store (IndexedDB) ——— */
let dbP=null;
function idb(){
  if(!dbP)dbP=new Promise((res,rej)=>{
    const r=indexedDB.open("riffle-files",1);
    r.onupgradeneeded=()=>r.result.createObjectStore("blobs");
    r.onsuccess=()=>res(r.result);
    r.onerror=()=>rej(r.error);
  });
  return dbP;
}
async function putBlob(id,blob){
  const d=await idb();
  return new Promise((res,rej)=>{const t=d.transaction("blobs","readwrite");t.objectStore("blobs").put(blob,id);t.oncomplete=res;t.onerror=()=>rej(t.error);});
}
async function getBlob(id){
  const d=await idb();
  return new Promise((res,rej)=>{const rq=d.transaction("blobs").objectStore("blobs").get(id);rq.onsuccess=()=>res(rq.result||null);rq.onerror=()=>rej(rq.error);});
}
async function delBlob(id){
  try{const d=await idb();d.transaction("blobs","readwrite").objectStore("blobs").delete(id);}catch(e){}
  const u=urlCache.get(id);if(u){URL.revokeObjectURL(u);urlCache.delete(id);}
}
const urlCache=new Map();
async function blobURL(id){
  if(urlCache.has(id))return urlCache.get(id);
  const b=await getBlob(id);
  if(!b)throw new Error("missing");
  const u=URL.createObjectURL(b);
  urlCache.set(id,u);
  return u;
}
function hydrate(root){
  root.querySelectorAll("img[data-blob]").forEach(img=>{
    blobURL(img.dataset.blob).then(u=>{img.src=u;}).catch(()=>{img.closest(".tile")?.remove();});
  });
}

/* ——— item helpers ——— */
function extOf(name){const m=/\.([a-z0-9]+)$/i.exec(name||"");return m?m[1].toLowerCase():"";}
function kindOf(file){
  const t=file.type||"";
  if(t.startsWith("image/"))return"img";
  if(t==="application/pdf"||extOf(file.name)==="pdf")return"pdf";
  if(t.startsWith("video/"))return"video";
  return"file";
}
function findItem(pi,itemId){return book.pages[pi]?.items.find(x=>x.id===itemId);}

async function addFiles(fileList,pi){
  const files=[...fileList];if(!files.length)return;
  const p=book.pages[pi];if(!p)return;
  const sz=(p.items.length+files.length)>10?"s":"m";
  let added=0;
  for(const f of files){
    if(f.size>60*1048576){toast('"'+f.name+'" is over 60 MB — skipped');continue;}
    const it={id:uid(),name:f.name||"file",ext:extOf(f.name),kind:kindOf(f),size:f.size,sz};
    try{await putBlob(it.id,f);}catch(e){toast("File storage is full — couldn't add "+f.name);break;}
    p.items.push(it);added++;
  }
  if(added){save();renderAll();toast(added+(added===1?" file":" files")+" added to p. "+(pi+1));}
}

/* ——— rendering ——— */
const $=id=>document.getElementById(id);
const bookEl=$("book"),statL=$("statL"),statR=$("statR");

function tileHTML(it,pi){
  const inner=it.kind==="img"
    ?'<img class="thumb" data-blob="'+it.id+'" alt="'+esc(it.name)+'" draggable="false">'
    :'<div class="doccard"><span class="docg">'+(it.kind==="pdf"?"📄":it.kind==="video"?"🎞":"📁")+'</span><span class="extb" style="--ec:'+(EXTC[it.ext]||"#6b6252")+'">'+esc(it.ext||"file")+'</span></div>';
  return '<figure class="tile '+it.sz+'" draggable="true" data-item="'+it.id+'" data-idx="'+pi+'" title="'+esc(it.name)+'">'+inner+
    '<figcaption>'+esc(it.name)+'</figcaption>'+
    '<span class="tacts">'+
      '<button class="ta" data-tact="grow" title="Bigger">＋</button>'+
      '<button class="ta" data-tact="shrink" title="Smaller">－</button>'+
      '<button class="ta" data-tact="move" title="Move to another page">⇄</button>'+
      '<button class="ta" data-tact="tdel" title="Remove">✕</button>'+
    '</span></figure>';
}
function renderFace(i,editable){
  const d=document.createElement("div");d.className="pface";d.dataset.page=i;
  if(i<0||i>=N()){d.classList.add("blank");return d;}
  const p=book.pages[i],sec=secById(p.sectionId);
  const ce=editable?' contenteditable="true"':'';
  d.innerHTML=
    '<div class="p-head"><span class="p-chip" style="--tc:'+sec.color+'">'+esc(sec.name)+'</span><span class="p-num">p. '+(i+1)+'</span></div>'+
    '<div class="p-title"'+ce+' data-f="title" data-idx="'+i+'" data-ph="Untitled page">'+esc(p.title)+'</div>'+
    '<div class="p-scroll">'+
      '<div class="p-body"'+ce+' data-f="body" data-idx="'+i+'" data-ph="Write here… or just drop files on the page">'+p.body+'</div>'+
      (p.items.length?'<div class="p-media" data-idx="'+i+'">'+p.items.map(it=>tileHTML(it,i)).join("")+'</div>':'')+
    '</div>'+
    '<div class="p-foot"><span class="p-date">'+esc(p.date||"")+'</span>'+
    '<span class="p-acts">'+
      '<button class="pa" data-act="attach" data-idx="'+i+'" title="Add files to this page">📎 Files</button>'+
      '<button class="pa" data-act="copy" data-idx="'+i+'" title="Copy this page">⧉</button>'+
      '<button class="pa" data-act="mail" data-idx="'+i+'" title="Email this page">✉</button>'+
      '<button class="pa" data-act="del" data-idx="'+i+'" title="Tear this page out">✕</button>'+
    '</span></div>';
  return d;
}
function setStatic(el,i,editable){el.replaceChildren(renderFace(i,editable!==false));hydrate(el);}

function renderTabs(){
  const rail=$("tabs");rail.replaceChildren();
  const curSec=book.pages[rightIdx(s)]?.sectionId ?? book.pages[leftIdx(s)]?.sectionId;
  book.sections.forEach(sec=>{
    const b=document.createElement("button");
    b.className="tab"+(sec.id===curSec?" active":"");
    b.style.setProperty("--tc",sec.color);
    b.textContent=sec.name;
    b.title="Riffle to "+sec.name;
    b.addEventListener("click",()=>{
      const i=book.pages.findIndex(p=>p.sectionId===sec.id);
      if(i>=0)goTo(i);else addPage(sec.id);
    });
    rail.appendChild(b);
  });
}
function renderEdges(){
  const first=stride===2?s*2:s, last=rightIdx(s);
  const before=Math.max(0,first), after=Math.max(0,N()-1-last);
  const wl=Math.min(4+before*1.1,26), wr=Math.min(4+after*1.1,26);
  $("edgeL").style.width=wl+"px";$("edgeL").style.left=-wl/2+"px";
  $("edgeR").style.width=wr+"px";$("edgeR").style.right=-wr/2+"px";
}
function renderPager(){
  const a=stride===2?s*2+1:s+1,b=Math.min(rightIdx(s)+1,N());
  const label=stride===2&&b>a?("Pages "+a+"–"+b):("Page "+Math.min(a,N()));
  $("pagerTxt").innerHTML="<b>"+label+"</b> of "+N();
  $("prevBtn").disabled=s<=0;
  $("nextBtn").disabled=s>=maxS();
}
function renderAll(){
  s=Math.max(0,Math.min(s,maxS()));
  if(stride===2)setStatic(statL,leftIdx(s));
  setStatic(statR,rightIdx(s));
  renderTabs();renderEdges();renderPager();
}

/* ——— flipping ——— */
function makeLeaf(frontIdx,backIdx){
  const leaf=document.createElement("div");leaf.className="leaf";
  const f=document.createElement("div");f.className="lf front";f.appendChild(renderFace(frontIdx,false));
  const b=document.createElement("div");b.className="lf back";b.appendChild(renderFace(backIdx,false));
  const sh=document.createElement("div");sh.className="shade";
  leaf.append(f,b,sh);
  hydrate(leaf);
  return leaf;
}
function flipFwd(dur){
  if(flipping||s>=maxS())return Promise.resolve(false);
  flipping=true;
  const frontI=rightIdx(s),backI=stride===2?(s+1)*2:-1;
  setStatic(statR,rightIdx(s+1));
  const leaf=makeLeaf(frontI,backI);bookEl.appendChild(leaf);
  const d=reduced?0:dur;
  const anim=leaf.animate([{transform:"rotateY(0deg)"},{transform:"rotateY(-180deg)"}],{duration:d,easing:"cubic-bezier(.35,.1,.25,1)"});
  leaf.querySelector(".shade").animate([{opacity:0},{opacity:1,offset:.5},{opacity:0}],{duration:d});
  return anim.finished.then(()=>{s++;flipping=false;renderAll();leaf.remove();return true;});
}
function flipBack(dur){
  if(flipping||s<=0)return Promise.resolve(false);
  flipping=true;
  const frontI=rightIdx(s-1),backI=stride===2?leftIdx(s):-1;
  if(stride===2)setStatic(statL,leftIdx(s-1));
  const leaf=makeLeaf(frontI,backI);bookEl.appendChild(leaf);
  const d=reduced?0:dur;
  const anim=leaf.animate([{transform:"rotateY(-180deg)"},{transform:"rotateY(0deg)"}],{duration:d,easing:"cubic-bezier(.35,.1,.25,1)"});
  leaf.querySelector(".shade").animate([{opacity:0},{opacity:1,offset:.5},{opacity:0}],{duration:d});
  return anim.finished.then(()=>{s--;flipping=false;renderAll();leaf.remove();return true;});
}
async function goTo(pageIdx){
  const t=Math.max(0,Math.min(spreadOf(pageIdx),maxS()));
  if(t===s)return;
  if(reduced){s=t;renderAll();return;}
  let dist=Math.abs(t-s);
  if(dist>6){s=t+(s<t?-4:4);renderAll();dist=4;}
  let guard=0;
  while(s!==t&&guard++<12){
    const remaining=Math.abs(t-s);
    const dur=remaining>1?110:430;
    const ok=await (t>s?flipFwd(dur):flipBack(dur));
    if(!ok)break;
  }
}

/* ——— editing (event delegation) ——— */
bookEl.addEventListener("input",e=>{
  const el=e.target.closest("[data-f]");if(!el)return;
  const i=+el.dataset.idx,p=book.pages[i];if(!p)return;
  if(el.dataset.f==="title")p.title=el.textContent;
  else p.body=el.innerHTML;
  saveSoon();
});

/* ——— page + tile actions ——— */
async function removeItem(pi,itemId){
  const p=book.pages[pi];if(!p)return;
  const at=p.items.findIndex(x=>x.id===itemId);if(at<0)return;
  const [it]=p.items.splice(at,1);
  delBlob(it.id);save();renderAll();toast('"'+it.name+'" removed');
}
async function saveOut(it){
  let blob;
  try{blob=await getBlob(it.id);}catch(e){blob=null;}
  if(!blob){toast("File is missing from storage");return;}
  const ns=(window.claude&&window.claude.use)?await window.claude.use("downloads").catch(()=>null):null;
  if(ns){
    try{await ns.save({filename:it.name,data:blob});toast("Saved");return;}
    catch(err){
      if(err&&err.code==="declined")return;
      if(err&&err.code==="extension_not_enabled"){toast("This file type can't be saved from here yet");return;}
      if(err&&err.code==="too_large"){toast("Too big to save from here (16 MB limit)");return;}
      /* fall through to anchor for anything else */
    }
  }
  try{
    const a=document.createElement("a");
    a.href=await blobURL(it.id);a.download=it.name;a.click();
  }catch(e){toast("Couldn't save the file on this browser");}
}
const SZ=["s","m","l"];
function resize(pi,itemId,dir){
  const it=findItem(pi,itemId);if(!it)return;
  const at=Math.max(0,Math.min(SZ.indexOf(it.sz)+dir,SZ.length-1));
  if(SZ[at]===it.sz)return;
  it.sz=SZ[at];save();renderAll();
}

bookEl.addEventListener("click",e=>{
  const ta=e.target.closest(".ta");
  if(ta){
    e.stopPropagation();
    const tile=ta.closest(".tile"),pi=+tile.dataset.idx,itemId=tile.dataset.item;
    const act=ta.dataset.tact;
    if(act==="grow")resize(pi,itemId,1);
    else if(act==="shrink")resize(pi,itemId,-1);
    else if(act==="move")openMove(pi,itemId);
    else if(act==="tdel")removeItem(pi,itemId);
    return;
  }
  const tile=e.target.closest(".tile");
  if(tile&&tile.closest(".pstatic")){openLB(+tile.dataset.idx,tile.dataset.item);return;}
  const btn=e.target.closest(".pa");if(!btn)return;
  const i=+btn.dataset.idx,p=book.pages[i];if(!p)return;
  const act=btn.dataset.act;
  if(act==="attach"){
    attachTo=i;$("fileInput").value="";$("fileInput").click();
  }else if(act==="copy"){
    const txt=p.title+"\n\n"+textOf(p.body)+(p.items.length?"\n\nAttached: "+p.items.map(x=>x.name).join(", "):"");
    (navigator.clipboard?navigator.clipboard.writeText(txt):Promise.reject()).then(
      ()=>toast("Page copied — paste it anywhere"),
      ()=>toast("Couldn't copy on this browser"));
  }else if(act==="mail"){
    const a=document.createElement("a");
    a.href="mailto:?subject="+encodeURIComponent(p.title||"A page from my book")+"&body="+encodeURIComponent(textOf(p.body));
    a.click();
  }else if(act==="del"){
    if(N()<=1){toast("A book needs at least one page");return;}
    if(!confirm('Tear out "'+(p.title||"this page")+'"'+(p.items.length?" and its "+p.items.length+" files":"")+"?"))return;
    p.items.forEach(it=>delBlob(it.id));
    book.pages.splice(i,1);save();
    s=Math.min(s,maxS());renderAll();toast("Page removed");
  }
});

/* ——— uploads: button, OS drag-drop, paste ——— */
let attachTo=0;
$("fileInput").addEventListener("change",e=>{addFiles(e.target.files,attachTo);});

bookEl.addEventListener("dragover",e=>{
  if([...e.dataTransfer.types].includes("Files")){
    e.preventDefault();
    const face=e.target.closest(".pface");
    bookEl.querySelectorAll(".pface.droptarget").forEach(f=>{if(f!==face)f.classList.remove("droptarget");});
    if(face&&!face.classList.contains("blank"))face.classList.add("droptarget");
  }
});
bookEl.addEventListener("dragleave",e=>{
  if(!bookEl.contains(e.relatedTarget))bookEl.querySelectorAll(".pface.droptarget").forEach(f=>f.classList.remove("droptarget"));
});
bookEl.addEventListener("drop",e=>{
  const face=e.target.closest(".pface");
  bookEl.querySelectorAll(".pface.droptarget").forEach(f=>f.classList.remove("droptarget"));
  if([...e.dataTransfer.types].includes("Files")){
    e.preventDefault();
    if(face&&!face.classList.contains("blank"))addFiles(e.dataTransfer.files,+face.dataset.page);
  }
});
document.addEventListener("paste",e=>{
  if(e.target.closest("input"))return;
  const files=e.clipboardData?.files;
  if(files&&files.length){e.preventDefault();addFiles(files,curPageIdx());}
});

/* ——— tile reordering (drag within/between visible pages) ——— */
let dragItem=null;
bookEl.addEventListener("dragstart",e=>{
  const tile=e.target.closest(".tile");if(!tile)return;
  dragItem={pi:+tile.dataset.idx,id:tile.dataset.item};
  e.dataTransfer.setData("text/riffle-item",tile.dataset.item);
  e.dataTransfer.effectAllowed="move";
  tile.classList.add("dragging");
});
bookEl.addEventListener("dragend",()=>{
  dragItem=null;
  bookEl.querySelectorAll(".tile.dragging").forEach(t=>t.classList.remove("dragging"));
  bookEl.querySelectorAll(".tile.dropbefore").forEach(t=>t.classList.remove("dropbefore"));
});
bookEl.addEventListener("dragover",e=>{
  if(!dragItem)return;
  const over=e.target.closest(".p-media, .pface");
  if(over){e.preventDefault();e.dataTransfer.dropEffect="move";}
  const tile=e.target.closest(".tile");
  bookEl.querySelectorAll(".tile.dropbefore").forEach(t=>t.classList.remove("dropbefore"));
  if(tile&&tile.dataset.item!==dragItem.id)tile.classList.add("dropbefore");
});
bookEl.addEventListener("drop",e=>{
  if(!dragItem)return;
  const face=e.target.closest(".pface");
  if(!face||face.classList.contains("blank"))return;
  e.preventDefault();
  const toPi=+face.dataset.page;
  const src=book.pages[dragItem.pi];if(!src)return;
  const at=src.items.findIndex(x=>x.id===dragItem.id);if(at<0)return;
  const [it]=src.items.splice(at,1);
  const dst=book.pages[toPi];
  const overTile=e.target.closest(".tile");
  let insertAt=dst.items.length;
  if(overTile&&overTile.dataset.item!==it.id){
    const j=dst.items.findIndex(x=>x.id===overTile.dataset.item);
    if(j>=0)insertAt=j;
  }
  dst.items.splice(insertAt,0,it);
  dragItem=null;save();renderAll();
});

/* ——— move dialog ——— */
const moveDlg=$("moveDlg");
let moveCtx=null;
function openMove(pi,itemId){
  moveCtx={pi,itemId};
  const list=$("mvList");list.replaceChildren();
  book.pages.forEach((p,i)=>{
    const sec=secById(p.sectionId);
    const b=document.createElement("button");b.className="mv";
    b.innerHTML='<span class="dotc" style="--tc:'+sec.color+'"></span>'+esc(p.title||"Untitled")+(i===pi?" (here)":"")+'<span class="mnum">p. '+(i+1)+'</span>';
    b.addEventListener("click",()=>{
      moveDlg.close();
      if(i===moveCtx.pi)return;
      const src=book.pages[moveCtx.pi];
      const at=src.items.findIndex(x=>x.id===moveCtx.itemId);if(at<0)return;
      const [it]=src.items.splice(at,1);
      book.pages[i].items.push(it);
      save();renderAll();toast('Moved to p. '+(i+1));
      if(lbCtx)closeLB();
    });
    list.appendChild(b);
  });
  moveDlg.showModal();
}
$("mvCancel").addEventListener("click",()=>moveDlg.close());

/* ——— lightbox ——— */
const lb=$("lb"),lbStage=$("lbStage");
let lbCtx=null; /* {pi, pos} */
function lbClear(){[...lbStage.children].forEach(c=>{if(!c.classList.contains("lb-nav"))c.remove();});lbStage.classList.remove("scrolly");}
async function openLB(pi,itemId){
  const p=book.pages[pi];if(!p)return;
  const pos=p.items.findIndex(x=>x.id===itemId);if(pos<0)return;
  lbCtx={pi,pos};
  await showLB();
  lb.classList.add("open");
}
async function showLB(){
  const p=book.pages[lbCtx.pi];const it=p.items[lbCtx.pos];if(!it){closeLB();return;}
  $("lbName").textContent=it.name;
  $("lbMeta").textContent=fmtSize(it.size)+" · "+(lbCtx.pos+1)+" of "+p.items.length+" on p. "+(lbCtx.pi+1);
  lbClear();
  const showCard=msg=>{
    const c=document.createElement("div");c.className="lb-card";
    c.innerHTML='<span class="extb" style="--ec:'+(EXTC[it.ext]||"#6b6252")+'">'+esc(it.ext||"file")+'</span><p>'+msg+'</p>';
    lbStage.appendChild(c);
  };
  let url=null;
  try{url=await blobURL(it.id);}catch(e){}
  if(!url){showCard("This file is missing from this browser's storage.");return;}
  if(it.kind==="img"){
    const img=document.createElement("img");img.className="lb-img";img.src=url;img.alt=it.name;
    img.addEventListener("click",()=>{img.classList.toggle("full");lbStage.classList.toggle("scrolly",img.classList.contains("full"));});
    lbStage.appendChild(img);
  }else if(it.kind==="pdf"){
    const fr=document.createElement("iframe");fr.className="lb-frame";fr.src=url;fr.title=it.name;
    lbStage.appendChild(fr);
    const note=document.createElement("p");
    note.style.cssText="position:absolute;bottom:4px;left:0;right:0;text-align:center;font:12px Archivo,sans-serif;color:#a89a7f";
    note.textContent="Preview blank? Some browsers block inline PDFs here — use Save file below.";
    lbStage.appendChild(note);
  }else if(it.kind==="video"){
    const v=document.createElement("video");v.className="lb-video";v.src=url;v.controls=true;
    lbStage.appendChild(v);
  }else{
    const isDeck=["ppt","pptx","key"].includes(it.ext);
    showCard(isDeck
      ?"PowerPoint decks don't preview in the browser — save the file to open it in PowerPoint. Tip: export the slides as JPEGs and drop them on the page to see all of them at once."
      :"No in-browser preview for this type — save the file to open it in its own app.");
  }
}
function closeLB(){lb.classList.remove("open");lbClear();lbCtx=null;}
$("lbClose").addEventListener("click",closeLB);
lb.addEventListener("click",e=>{if(e.target===lb||e.target===lbStage)closeLB();});
$("lbPrev").addEventListener("click",()=>{if(!lbCtx)return;const n=book.pages[lbCtx.pi].items.length;lbCtx.pos=(lbCtx.pos+n-1)%n;showLB();});
$("lbNext").addEventListener("click",()=>{if(!lbCtx)return;const n=book.pages[lbCtx.pi].items.length;lbCtx.pos=(lbCtx.pos+1)%n;showLB();});
$("lbSave").addEventListener("click",()=>{if(!lbCtx)return;const it=book.pages[lbCtx.pi].items[lbCtx.pos];if(it)saveOut(it);});
$("lbMove").addEventListener("click",()=>{if(!lbCtx)return;const it=book.pages[lbCtx.pi].items[lbCtx.pos];if(it)openMove(lbCtx.pi,it.id);});
$("lbDel").addEventListener("click",()=>{
  if(!lbCtx)return;const it=book.pages[lbCtx.pi].items[lbCtx.pos];if(!it)return;
  removeItem(lbCtx.pi,it.id);
  const p=book.pages[lbCtx.pi];
  if(!p||!p.items.length)closeLB();
  else{lbCtx.pos=Math.min(lbCtx.pos,p.items.length-1);showLB();}
});

/* ——— toolbar ——— */
function addPage(sectionId){
  const curI=rightIdx(s)<N()?rightIdx(s):leftIdx(s);
  const sid=sectionId||book.pages[curI]?.sectionId||book.sections[0].id;
  let at=-1;
  for(let i=book.pages.length-1;i>=0;i--)if(book.pages[i].sectionId===sid){at=i;break;}
  const p={id:uid(),sectionId:sid,title:"",date:today(),body:"",items:[]};
  book.pages.splice(at+1,0,p);save();
  renderAll();
  goTo(at+1).then(()=>{
    const t=bookEl.querySelector('.pstatic [data-f="title"][data-idx="'+(at+1)+'"]');
    if(t)t.focus();
  });
}
$("newPageBtn").addEventListener("click",()=>addPage());
$("prevBtn").addEventListener("click",()=>flipBack(430));
$("nextBtn").addEventListener("click",()=>flipFwd(430));
$("fzR").addEventListener("click",()=>flipFwd(430));
$("fzL").addEventListener("click",()=>flipBack(430));

document.addEventListener("keydown",e=>{
  if(lb.classList.contains("open")){
    if(e.key==="Escape")closeLB();
    if(e.key==="ArrowRight")$("lbNext").click();
    if(e.key==="ArrowLeft")$("lbPrev").click();
    return;
  }
  if(e.target.closest("input,textarea")||document.activeElement?.isContentEditable)return;
  if(e.key==="ArrowRight"){e.preventDefault();flipFwd(430);}
  if(e.key==="ArrowLeft"){e.preventDefault();flipBack(430);}
});

/* ——— new tab dialog ——— */
const dlg=$("tabDlg");let pickedColor=COLORS[0];
const swWrap=$("swatches");
COLORS.forEach((c,i)=>{
  const b=document.createElement("button");
  b.type="button";b.className="sw"+(i===0?" sel":"");b.style.background=c;b.title=c;
  b.addEventListener("click",()=>{pickedColor=c;swWrap.querySelectorAll(".sw").forEach(x=>x.classList.remove("sel"));b.classList.add("sel");});
  swWrap.appendChild(b);
});
$("newTabBtn").addEventListener("click",()=>{$("tabName").value="";dlg.showModal();$("tabName").focus();});
dlg.addEventListener("close",()=>{
  if(dlg.returnValue!=="go")return;
  const name=$("tabName").value.trim();if(!name)return;
  const sec={id:uid(),name,color:pickedColor};
  book.sections.push(sec);save();
  addPage(sec.id);
  toast('Tab "'+name+'" added');
});

/* ——— search ——— */
const q=$("q"),sres=$("sres");
function snippet(txt,term){
  const at=txt.toLowerCase().indexOf(term.toLowerCase());
  const start=Math.max(0,at-34);
  let sn=(start>0?"…":"")+txt.slice(start,start+110)+(start+110<txt.length?"…":"");
  return esc(sn).replace(new RegExp("("+term.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+")","ig"),"<mark>$1</mark>");
}
function doSearch(){
  const term=q.value.trim();
  if(term.length<2){sres.classList.remove("open");sres.replaceChildren();return;}
  const hits=[];
  book.pages.forEach((p,i)=>{
    const txt=p.title+" "+textOf(p.body)+" "+p.items.map(x=>x.name).join(" ");
    if(txt.toLowerCase().includes(term.toLowerCase()))hits.push({i,p,txt});
  });
  sres.replaceChildren();
  hits.slice(0,8).forEach(h=>{
    const sec=secById(h.p.sectionId);
    const b=document.createElement("button");b.type="button";b.className="sr";
    b.innerHTML='<span class="srt"><span class="dotc" style="--tc:'+sec.color+'"></span>'+esc(h.p.title||"Untitled")+'<span class="srpg">p. '+(h.i+1)+'</span></span><span class="srs">'+snippet(h.txt,term)+'</span>';
    b.addEventListener("click",()=>{sres.classList.remove("open");q.blur();goTo(h.i);});
    sres.appendChild(b);
  });
  if(!hits.length){
    const dv=document.createElement("div");dv.className="sr";
    dv.innerHTML='<span class="srs">Nothing on any page matches “'+esc(term)+'”.</span>';
    sres.appendChild(dv);
  }
  sres.classList.add("open");
}
q.addEventListener("input",doSearch);
q.addEventListener("keydown",e=>{
  if(e.key==="Escape"){sres.classList.remove("open");q.blur();}
  if(e.key==="Enter"){const first=sres.querySelector("button.sr");if(first)first.click();}
});
document.addEventListener("click",e=>{if(!e.target.closest(".searchbox"))sres.classList.remove("open");});

/* ——— toast ——— */
let toastT;
function toast(msg){const t=$("toast");t.textContent=msg;t.classList.add("on");clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove("on"),2400);}

/* ——— responsive stride ——— */
mq.addEventListener("change",()=>{
  const visible=stride===2?s*2:s;
  stride=mq.matches?1:2;
  s=spreadOf(Math.min(visible,N()-1));
  renderAll();
});

renderAll();
})();
</script>
